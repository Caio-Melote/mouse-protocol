name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      # Audit what the published package installs. The package ships no runtime
      # dependencies, so this only ever reports advisories in code consumers
      # would receive; release tooling (semantic-release pulls in npm, which
      # bundles its own dependency tree) is deliberately excluded so a vuln in
      # some other project's bundled CLI cannot block our releases.
      - run: npm audit --omit=dev --audit-level=high

  # The suite is CPU-bound and runs serially (~6 min locally, ~11 min on a
  # runner), so it is sharded across jobs instead of one long run. Each shard
  # is a deterministic slice of the tracked test files; see
  # scripts/ci-test-shard.mjs.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node scripts/ci-test-shard.mjs ${{ matrix.shard }} 4
